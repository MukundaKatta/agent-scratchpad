name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests (no dependencies required)
        run: python -m unittest discover -s tests -v
      - name: Byte-compile all sources
        run: python -m compileall -q src tests

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the package
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the built wheel and smoke-test the import
        run: |
          python -m pip install dist/*.whl
          python -c "from agent_scratchpad import Scratchpad; p = Scratchpad(); p.write('k', 'v'); assert p.read('k') == 'v'; print('import OK')"
