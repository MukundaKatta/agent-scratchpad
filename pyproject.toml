[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-scratchpad"
version = "0.1.0"
description = "Keyed in-memory notepad for agent loops — write, read, search, TTL expiry, prompt injection. Zero dependencies."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["agents", "llm", "scratchpad", "notepad", "memory"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/MukundaKatta/agent-scratchpad"

[tool.setuptools.packages.find]
where = ["src"]
