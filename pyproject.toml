[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-scratchpad"
version = "0.1.0"
description = "Keyed in-memory notepad for agent loops — write, read, search, TTL expiry, prompt injection. Zero dependencies."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["agents", "llm", "scratchpad", "notepad", "memory"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
# No runtime or test dependencies are required: the library is pure stdlib and
# the test suite uses unittest. This extra exists only as a convenience for
# building/publishing the package.
dev = ["build"]

[project.urls]
Homepage = "https://github.com/MukundaKatta/agent-scratchpad"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the PEP 561 typing marker so type checkers honour the inline hints.
agent_scratchpad = ["py.typed"]
